  async get(key) {
    if (!window.fbDb) return null;
    const snap = await window.fbDb.ref(fbPath(key)).get();
    if (!snap.exists()) return null;
    return { key, value: snap.val(), shared: true };
  },
  async set(key, value) {
    if (!window.fbDb) return null;
    await window.fbDb.ref(fbPath(key)).set(value);
    return { key, value, shared: true };
  },
  async delete(key) {
    if (!window.fbDb) return null;
    await window.fbDb.ref(fbPath(key)).remove();
    return { key, deleted: true, shared: true };
  },
};

function compressImage(file, maxDim = 1000, quality = 0.62) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL("image/jpeg", quality), width: w, height: h });
      };
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.readAsDataURL(file);
  });
}

function approxKB(dataUrl) {
  return Math.round((dataUrl.length * 0.75) / 1024);
}

function BukuKunjungan() {
  const [nasabahList, setNasabahList] = useState([]);

  const [showForm, setShowForm] = useState(false);

  const [visitForId, setVisitForId] = useState(null);
  const [visitDate, setVisitDate] = useState(todayStr());
  const [visitResult, setVisitResult] = useState("");
  const [visitPhotos, setVisitPhotos] = useState([]);

  const leafletMapRef = useRef(null);
  const leafletMarkerRef = useRef(null);

  useEffect(() => {
    if (!window.fbDb) {
      setLoading(false);
      setSaveError("Belum terhubung ke Firebase.");
      return;
    }
    const ref = window.fbDb.ref(fbPath(INDEX_KEY));
    const onValue = (snap) => {
      if (snap.exists() && snap.val()) {
        try {
          setNasabahList(JSON.parse(snap.val()));
        } catch (e) {
          setSaveError("Data di server rusak / tidak terbaca.");
        }
      } else {
        const seeded = SEED_NASABAH.map((n) => ({ ...n, visitCount: 0 }));
        setNasabahList(seeded);
        ref.set(JSON.stringify(seeded)).catch(() => setSaveError("Gagal mengisi data awal ke Firebase."));
      }
      setLoading(false);
    };
    const onError = (err) => {
      setSaveError("Gagal terhubung ke Firebase: " + err.message);
      setLoading(false);
    };
    ref.on("value", onValue, onError);
    return () => ref.off("value", onValue);
  }, []);

  const persistIndex = useCallback(async (list) => {
    try {
      if (!window.fbDb) throw new Error("no db");
      await window.fbDb.ref(fbPath(INDEX_KEY)).set(JSON.stringify(list));
      setSaveError("");
    } catch (e) {
      setSaveError("Gagal menyimpan data.");
    }
  }, []);

  const updateIndex = (updater) => {
    setNasabahList((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      persistIndex(next);
      return next;
    });
  };

  const loadDetail = useCallback(async (id) => {
    if (detailCache[id]) return detailCache[id];
    setLoadingDetailId(id);
    let detail = { kunjungan: [] };
    try {
      const res = await storage.get(detailKey(id), false);
      if (res && res.value) detail = JSON.parse(res.value);
    } catch (e) {}
    setDetailCache((prev) => ({ ...prev, [id]: detail }));
    setLoadingDetailId(null);
    return detail;
  }, [detailCache]);

  const persistDetail = async (id, detail) => {
    try {
      await storage.set(detailKey(id), JSON.stringify(detail), false);
      setSaveError("");
    } catch (e) {
      setSaveError("Gagal menyimpan catatan kunjungan.");
    }
  };

  const toggleExpand = async (id) => {
    if (expandedId === id) {
      setExpandedId(null);
      return;
    }
    setExpandedId(id);
    if (!detailCache[id]) await loadDetail(id);
  };

  const openAddForm = () => {
    setForm(emptyForm);
    setEditingId(null);
    setShowForm(true);
  };
  const openEditForm = (n) => {
    setForm({ nomor: n.nomor, nama: n.nama, rekSimpanan: n.rekSimpanan, rekPembiayaan: n.rekPembiayaan, alamat: n.alamat });
    setEditingId(n.id);
    setShowForm(true);
  };

  const submitForm = (e) => {
    e.preventDefault();
    if (!form.nama.trim()) return;
    if (editingId) {
      updateIndex((prev) => prev.map((n) => (n.id === editingId ? { ...n, ...form } : n)));
    } else {
      updateIndex((prev) => [...prev, { id: uid(), ...form, visitCount: 0 }]);
    }
    setShowForm(false);
    setForm(emptyForm);
    setEditingId(null);
  };

  const deleteNasabah = async (id) => {
    updateIndex((prev) => prev.filter((n) => n.id !== id));

  useEffect(() => {
    if (!visitForId || !mapDivRef.current || !window.L) return;
    const center = visitLocation ? [visitLocation.lat, visitLocation.lng] : DEFAULT_MAP_CENTER;

    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '© OpenStreetMap',
      maxZoom: 19,
    }).addTo(map);

      const pos = marker.getLatLng();
      setVisitLocation({ lat: pos.lat, lng: pos.lng });
    });
    map.on("click", (e) => {
      marker.setLatLng(e.latlng);
      setVisitLocation({ lat: e.latlng.lat, lng: e.latlng.lng });
    });
    leafletMapRef.current = map;
    leafletMarkerRef.current = marker;

      map.remove();
      leafletMapRef.current = null;
      leafletMarkerRef.current = null;

    }
    const room = Math.max(0, 4 - visitPhotos.length);
    const toProcess = files.slice(0, room);
    setCompressing(true);

      const results = [];
      for (const file of toProcess) {

    } finally {
      setCompressing(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const removePhoto = (idx) => {
    setVisitPhotos((prev) => prev.filter((_, i) => i !== idx));
  };

  const captureLocation = () => {
    setLocError("");
    if (!navigator.geolocation) {
      setLocError("GPS tidak didukung.");
      return;
    }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setVisitLocation(loc);
        if (leafletMapRef.current && leafletMarkerRef.current) {
          leafletMarkerRef.current.setLatLng([loc.lat, loc.lng]);
          leafletMapRef.current.setView([loc.lat, loc.lng], 16);
        }
        setLocating(false);
      },
      (err) => {
        setLocError("Gagal mengambil lokasi.");
        setLocating(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const submitVisit = async (e) => {
    e.preventDefault();
    if (!visitResult.trim()) return;
    const id = visitForId;
    const current = detailCache[id] || (await loadDetail(id));
    const newVisit = {
      id: uid(),
      tanggal: visitDate,
      hasil: visitResult.trim(),
      photos: visitPhotos.map((p) => p.dataUrl),
      location: visitLocation,
    };
    const nextDetail = { kunjungan: [...current.kunjungan, newVisit] };
    setDetailCache((prev) => ({ ...prev, [id]: nextDetail }));
    await persistDetail(id, nextDetail);
    updateIndex((prev) => prev.map((n) => (n.id === id ? { ...n, visitCount: nextDetail.kunjungan.length } : n)));
    setVisitForId(null);
    setVisitPhotos([]);
    setVisitLocation(null);
  };

  const deleteVisit = async (nasabahId, visitId) => {
    const current = detailCache[nasabahId];
    if (!current) return;
    const nextDetail = { kunjungan: current.kunjungan.filter((v) => v.id !== visitId) };
    setDetailCache((prev) => ({ ...prev, [nasabahId]: nextDetail }));
    await persistDetail(nasabahId, nextDetail);
    updateIndex((prev) => prev.map((n) => (n.id === nasabahId ? { ...n, visitCount: nextDetail.kunjungan.length } : n)));
  };

  const filtered = nasabahList.filter((n) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return (
      n.nama.toLowerCase().includes(q) ||
      (n.nomor || "").toLowerCase().includes(q) ||
      (n.alamat || "").toLowerCase().includes(q) ||
      (n.rekSimpanan || "").toLowerCase().includes(q) ||
      (n.rekPembiayaan || "").toLowerCase().includes(q)
    );
  });

  return (
    <div style={styles.page}>
      <style>{FONT_IMPORT}{`
        * { box-sizing: border-box; }
        input, textarea { font-family: 'Inter', sans-serif; }
        input:focus, textarea:focus { outline: 2px solid #8A6A2F; outline-offset: 1px; }
        button:focus-visible { outline: 2px solid #8A6A2F; outline-offset: 2px; }
        ::placeholder { color: #9C9686; }
      `}</style>

      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.stampMark}>BK</div>
          <div>
            <h1 style={styles.title}>Buku Kunjungan Nasabah</h1>
            <p style={styles.subtitle}>Catatan lapangan kunjungan, foto &amp; lokasi nasabah</p>
          </div>
        </div>
      </header>

      <main style={styles.main}>
        {saveError && <div style={styles.errorBanner}>{saveError}</div>}

        <div style={styles.toolbar}>
          <input
            type="text"
            placeholder="Cari nama, nomor, rekening, atau alamat..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            style={styles.searchInput}
          />
          <button style={styles.primaryBtn} onClick={openAddForm}>+ Tambah Nasabah</button>
        </div>

        <div style={styles.countLine}>{nasabahList.length} nasabah tercatat{query ? ` · ${filtered.length} hasil pencarian` : ""}</div>

        {loading ? (
          <div style={styles.emptyState}>Memuat data…</div>
        ) : filtered.length === 0 ? (
          <div style={styles.emptyState}>
            {nasabahList.length === 0 ? (
              <>
                <div style={styles.emptyIcon}>◇</div>
                <p style={styles.emptyText}>Belum ada nasabah tercatat.</p>
              </>
            ) : (
              <p style={styles.emptyText}>Tidak ada hasil untuk "{query}".</p>
            )}
          </div>
        ) : (
          <div style={styles.cardList}>
            {filtered.map((n) => {
              const isOpen = expandedId === n.id;
              const detail = detailCache[n.id];
              const visitCount = n.visitCount || 0;
              return (
                <div key={n.id} style={styles.card}>
                  <div style={styles.cardHead} onClick={() => toggleExpand(n.id)}>
                    <div style={styles.cardHeadLeft}>
                      <div style={styles.nomorTag}>{n.nomor || "—"}</div>
                      <div style={{ minWidth: 0 }}>
                        <div style={styles.namaText}>{n.nama}</div>
                        <div style={styles.alamatText}>{n.alamat || "Alamat belum diisi"}</div>
                      </div>
                    </div>
                    <div style={styles.cardHeadRight}>
                      <div style={styles.visitBadge}>{visitCount === 0 ? "Belum dikunjungi" : `${visitCount}x kunjungan`}</div>
                      <div style={{ ...styles.chevron, transform: isOpen ? "rotate(90deg)" : "rotate(0deg)" }}>›</div>
                    </div>
                  </div>

                  {isOpen && (
                    <div style={styles.cardBody}>
                      <div style={styles.detailGrid}>
                        <div>
                          <div style={styles.detailLabel}>Rek. Simpanan</div>
                          <div style={styles.detailValueMono}>{n.rekSimpanan || "-"}</div>
                        </div>
                        <div>
                          <div style={styles.detailLabel}>Rek. Pembiayaan</div>
                          <div style={styles.detailValueMono}>{n.rekPembiayaan || "-"}</div>
                        </div>
                      </div>

                      <div style={styles.rowActions}>
                        <button style={styles.linkBtn} onClick={() => openEditForm(n)}>Edit data</button>
                        <span style={styles.dotSep}>·</span>
                        {n.alamat ? (
                          <a href={mapsAddressUrl(n.alamat)} target="_blank" rel="noopener noreferrer" style={styles.mapLink}>
                            🗺️ Peta alamat
                          </a>
                        ) : (
                          <span style={styles.mapLinkDisabled}>🗺️ Peta alamat</span>
                        )}
                        <span style={styles.dotSep}>·</span>
                        {confirmDeleteId === n.id ? (
                          <>
                            <span style={styles.confirmText}>Hapus nasabah ini?</span>
                            <button style={styles.dangerLinkBtn} onClick={() => deleteNasabah(n.id)}>Ya, hapus</button>
                            <span style={styles.dotSep}>·</span>
                            <button style={styles.linkBtn} onClick={() => setConfirmDeleteId(null)}>Batal</button>
                          </>
                        ) : (
                          <button style={styles.dangerLinkBtn} onClick={() => setConfirmDeleteId(n.id)}>Hapus</button>
                        )}
                      </div>

                      <div style={styles.ledgerSection}>
                        <div style={styles.ledgerHeadRow}>
                          <h3 style={styles.ledgerTitle}>Riwayat Kunjungan</h3>
                          <button style={styles.secondaryBtn} onClick={() => openVisitForm(n.id)}>
                            + Catat Kunjungan {ordinalLabel(visitCount + 1)}
                          </button>
                        </div>

                        {loadingDetailId === n.id ? (
                          <div style={styles.noVisit}>Memuat riwayat…</div>
                        ) : !detail || detail.kunjungan.length === 0 ? (
                          <div style={styles.noVisit}>Belum ada catatan kunjungan.</div>
                        ) : (
                          <div style={styles.ledger}>
                            {detail.kunjungan.map((v, idx) => (
                              <div key={v.id} style={styles.ledgerRow}>
                                <div style={styles.stamp}><div style={styles.stampNum}>{idx + 1}</div></div>
                                <div style={styles.ledgerContent}>
                                  <div style={styles.ledgerTop}>
                                    <span style={styles.ledgerOrdinal}>Kunjungan {ordinalLabel(idx + 1)}</span>
                                    <span style={styles.ledgerDate}>{formatTanggal(v.tanggal)}</span>
                                  </div>
                                  <div style={styles.ledgerHasil}>{v.hasil}</div>

                                  {v.photos && v.photos.length > 0 && (
                                    <div style={styles.thumbRow}>
                                      {v.photos.map((p, pi) => (
                                        <img
                                          key={pi}
                                          src={p}
                                          alt={`Foto kunjungan ${idx + 1}`}
                                          style={styles.thumb}
                                          onClick={() => setLightbox(p)}
                                        />
                                      ))}
                                    </div>
                                  )}

                                  <div style={styles.ledgerFootRow}>
                                    {v.location && (
                                      <a
                                        href={mapsCoordUrl(v.location.lat, v.location.lng)}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        style={styles.mapLinkSmall}
                                      >
                                        📍 Lihat lokasi kunjungan
                                      </a>
                                    )}
                                    <button style={styles.removeVisitBtn} onClick={() => deleteVisit(n.id, v.id)}>
                                      Hapus catatan
                                    </button>
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </main>

      {showForm && (
        <div style={styles.overlay} onClick={() => setShowForm(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <h2 style={styles.modalTitle}>{editingId ? "Edit Data Nasabah" : "Tambah Nasabah Baru"}</h2>
            <form onSubmit={submitForm}>
              <label style={styles.label}>Nomor Anggota</label>
              <input style={styles.input} value={form.nomor} onChange={(e) => setForm({ ...form, nomor: e.target.value })} placeholder="Contoh: 052-0341" />
              <label style={styles.label}>Nama *</label>
              <input style={styles.input} value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} placeholder="Nama lengkap nasabah" required />
              <label style={styles.label}>Rekening Simpanan</label>
              <input style={styles.input} value={form.rekSimpanan} onChange={(e) => setForm({ ...form, rekSimpanan: e.target.value })} placeholder="Nomor rekening simpanan" />
              <label style={styles.label}>Rekening Pembiayaan</label>
              <input style={styles.input} value={form.rekPembiayaan} onChange={(e) => setForm({ ...form, rekPembiayaan: e.target.value })} placeholder="Nomor rekening pembiayaan" />
              <label style={styles.label}>Alamat</label>
              <textarea style={{ ...styles.input, minHeight: 70, resize: "vertical" }} value={form.alamat} onChange={(e) => setForm({ ...form, alamat: e.target.value })} placeholder="Alamat domisili" />
              <div style={styles.modalActions}>
                <button type="button" style={styles.ghostBtn} onClick={() => setShowForm(false)}>Batal</button>
                <button type="submit" style={styles.primaryBtn}>{editingId ? "Simpan Perubahan" : "Tambah Nasabah"}</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {visitForId && (
        <div style={styles.overlay} onClick={() => setVisitForId(null)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <h2 style={styles.modalTitle}>Catat Hasil Kunjungan</h2>
            <form onSubmit={submitVisit}>
              <label style={styles.label}>Tanggal Kunjungan</label>
              <input type="date" style={styles.input} value={visitDate} onChange={(e) => setVisitDate(e.target.value)} required />

              <label style={styles.label}>Hasil Kunjungan *</label>
              <textarea
                style={{ ...styles.input, minHeight: 100, resize: "vertical" }}
                value={visitResult}
                onChange={(e) => setVisitResult(e.target.value)}
                placeholder="Hasil kunjungan..."
                required
                autoFocus
              />

              <label style={styles.label}>Foto Kunjungan (maks. 4)</label>
              <div style={styles.photoBtnRow}>
                <button
                  type="button"
                  style={styles.secondaryBtn}
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  disabled={compressing || visitPhotos.length >= 4}
                >
                  📷 Ambil Foto
                </button>
                <button
                  type="button"
                  style={styles.secondaryBtn}
                  onClick={() => galleryInputRef.current && galleryInputRef.current.click()}
                  disabled={compressing || visitPhotos.length >= 4}
                >
                  🖼️ Pilih dari Galeri
                </button>
              </div>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                capture="environment"
                multiple
                onChange={handlePhotoChange}
                style={{ display: "none" }}
                disabled={compressing || visitPhotos.length >= 4}
              />
              <input
                ref={galleryInputRef}
                type="file"
                accept="image/*"
                multiple
                onChange={handlePhotoChange}
                style={{ display: "none" }}
                disabled={compressing || visitPhotos.length >= 4}
              />
              {compressing && <div style={styles.hintText}>Mengompres foto…</div>}
              {photoError && <div style={styles.warnText}>{photoError}</div>}
              {visitPhotos.length > 0 && (
                <div style={styles.thumbRow}>
                  {visitPhotos.map((p, i) => (
                    <div key={i} style={styles.thumbWrap}>
                      <img src={p.dataUrl} alt={`Foto ${i + 1}`} style={styles.thumb} />
                      <button type="button" style={styles.thumbRemove} onClick={() => removePhoto(i)}>×</button>
                      <div style={styles.thumbSize}>{p.kb} KB</div>
                    </div>
                  ))}
                </div>
              )}

              <label style={styles.label}>Lokasi Kunjungan</label>
              <div style={styles.locRow}>
                <button type="button" style={styles.secondaryBtn} onClick={captureLocation} disabled={locating}>
                  {locating ? "Mengambil lokasi…" : "📍 Gunakan Lokasi Saat Ini"}
                </button>
                {visitLocation && (
                  <span style={styles.locCaptured}>
                    ({visitLocation.lat.toFixed(5)}, {visitLocation.lng.toFixed(5)})
                  </span>
                )}
              </div>
              <div style={styles.mapBox} ref={mapDivRef}></div>
              <div style={styles.hintText}>Geser pin atau ketuk peta untuk menyesuaikan titik lokasi.</div>
              {locError && <div style={styles.warnText}>{locError}</div>}

              <div style={styles.modalActions}>
                <button type="button" style={styles.ghostBtn} onClick={() => setVisitForId(null)}>Batal</button>
                <button type="submit" style={styles.primaryBtn} disabled={compressing}>Simpan Catatan</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {lightbox && (
        <div style={styles.lightboxOverlay} onClick={() => setLightbox(null)}>
          <img src={lightbox} alt="Foto" style={styles.lightboxImg} />
          <button style={styles.lightboxClose} onClick={() => setLightbox(null)}>Tutup ✕</button>
        </div>
      )}
    </div>
  );
}

  namaText: { fontFamily: "'Spectral', serif", fontWeight: 600, fontSize: 16, color: "#26241C" },

  ledgerSection: { borderTop: "1px dashed #DCD5BC", paddingTop: 16 },

  fileInput: { fontSize: 12.5, width: "100%" },
  photoBtnRow: { display: "flex", gap: 8, flexWrap: "wrap" },
  mapBox: { width: "100%", height: 220, borderRadius: 6, border: "1px solid #CFC7AE", marginTop: 10, background: "#E4E0D0" },

  modalTitle: { fontFamily: "'Spectral', serif", fontSize: 19, fontWeight: 700, margin: "0 0 16px", color: "#26241C" },
  label: { display: "block", fontSize: 12, fontWeight: 600, color: "#5B5745", marginBottom: 5, marginTop: 12 },
  input: { width: "100%", padding: "10px 12px", borderRadius: 6, border: "1px solid #CFC7AE", fontSize: 14, color: "#26241C", background: "#FFFEFA" },
  modalActions: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 22 },

};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
